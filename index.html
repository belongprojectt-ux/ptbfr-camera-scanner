<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    PTBFR 2026 - Race Pack Collection Scanner
  </title>


  <!-- =================================================
       QR SCANNER
       ================================================= -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 20px;
      background: #f3f5f6;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      color: #333;
    }


    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }


    .card {
      background: #fff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow:
        0 5px 25px rgba(0,0,0,.08);
    }


    /* =================================================
       HEADER
       ================================================= */

    .header {
      background: #16849c;
      color: #fff;
      text-align: center;
      padding: 30px 20px;
    }


    .header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
    }


    .header p {
      margin: 8px 0 0;
      font-size: 19px;
    }


    /* =================================================
       CONTENT
       ================================================= */

    .content {
      padding: 25px;
    }


    /* =================================================
       BUTTON
       ================================================= */

    .button {
      width: 100%;
      min-height: 58px;
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }


    .button-start {
      background: #16849c;
      color: #fff;
    }


    .button-stop {
      background: #a33;
      color: #fff;
      margin-top: 12px;
      display: none;
    }


    .button-reset {
      background: #777;
      color: #fff;
      margin-top: 15px;
    }


    .button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }


    /* =================================================
       CAMERA
       ================================================= */

    #reader {
      width: 100%;
      margin-top: 20px;
      border-radius: 16px;
      overflow: hidden;
      background: #111;
      min-height: 50px;
    }


    /* =================================================
       STATUS
       ================================================= */

    .status {
      margin-top: 18px;
      padding: 17px;
      border-radius: 14px;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
    }


    .status-info {
      background: #eef6f8;
      color: #176c7e;
    }


    .status-success {
      background: #d9f5e7;
      color: #08783f;
    }


    .status-error {
      background: #ffe2e2;
      color: #a00000;
    }


    /* =================================================
       QR RESULT
       ================================================= */

    #qrResult {
      display: none;
      margin-top: 18px;
      background: #eef6f8;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }


    .qr-title {
      font-size: 15px;
      color: #666;
      margin-bottom: 6px;
    }


    .qr-bib {
      font-size: 45px;
      font-weight: 700;
      color: #16849c;
    }


    /* =================================================
       OPEN APPS SCRIPT
       ================================================= */

    .webapp-box {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #eef6f8;
      border-radius: 15px;
      text-align: center;
    }


    .webapp-title {
      font-size: 16px;
      font-weight: 700;
      color: #555;
    }


    .webapp-status {
      margin-top: 8px;
      font-size: 14px;
      color: #777;
      line-height: 1.5;
    }


    /* =================================================
       MANUAL SEARCH
       ================================================= */

    .manual {
      margin-top: 25px;
      padding-top: 22px;
      border-top: 1px solid #ddd;
    }


    .manual-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #555;
    }


    .manual-row {
      display: flex;
      gap: 10px;
    }


    .manual-input {
      flex: 1;
      min-width: 0;
      height: 54px;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 18px;
      text-align: center;
      outline: none;
    }


    .manual-input:focus {
      border-color: #16849c;
    }


    .manual-button {
      width: 130px;
      height: 54px;
      border: none;
      border-radius: 12px;
      background: #16849c;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }


    /* =================================================
       INSTRUCTIONS
       ================================================= */

    .instructions {
      margin-top: 20px;
      text-align: center;
      color: #666;
      font-size: 15px;
      line-height: 1.6;
    }


    .instructions strong {
      color: #333;
    }


    /* =================================================
       MOBILE
       ================================================= */

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }


      .content {
        padding: 17px;
      }


      .header {
        padding: 25px 15px;
      }


      .header h1 {
        font-size: 27px;
      }


      .header p {
        font-size: 17px;
      }


      .manual-row {
        display: block;
      }


      .manual-input {
        width: 100%;
      }


      .manual-button {
        width: 100%;
        margin-top: 10px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="card">


    <!-- =================================================
         HEADER
         ================================================= -->

    <div class="header">

      <h1>
        PTBFR 2026
      </h1>

      <p>
        Race Pack Collection Scanner
      </p>

    </div>


    <div class="content">


      <!-- =================================================
           START CAMERA
           ================================================= -->

      <button
        id="startButton"
        class="button button-start"
        onclick="startCamera()"
      >

        📷 START CAMERA &amp; SCAN QR

      </button>


      <!-- =================================================
           STOP CAMERA
           ================================================= -->

      <button
        id="stopButton"
        class="button button-stop"
        onclick="stopCamera()"
      >

        ✕ STOP CAMERA

      </button>


      <!-- =================================================
           CAMERA AREA
           ================================================= -->

      <div id="reader"></div>


      <!-- =================================================
           STATUS
           ================================================= -->

      <div
        id="status"
        class="status status-info"
      >

        Tekan <strong>START CAMERA</strong>
        untuk mulai scan QR peserta.

      </div>


      <!-- =================================================
           QR RESULT
           ================================================= -->

      <div id="qrResult">

        <div class="qr-title">
          QR TERBACA
        </div>

        <div
          id="qrBib"
          class="qr-bib"
        >
          -
        </div>

      </div>


      <!-- =================================================
           WEB APP STATUS
           ================================================= -->

      <div
        id="webAppBox"
        class="webapp-box"
      >

        <div class="webapp-title">

          PTBFR Participant System

        </div>

        <div
          id="webAppStatus"
          class="webapp-status"
        >

          Menunggu scan...

        </div>

      </div>


      <!-- =================================================
           MANUAL SEARCH
           ================================================= -->

      <div class="manual">

        <div class="manual-title">

          Manual Search BIB

        </div>


        <div class="manual-row">

          <input
            id="manualBib"
            class="manual-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Contoh: 5001"
          >


          <button
            class="manual-button"
            onclick="manualSearch()"
          >

            SEARCH

          </button>

        </div>

      </div>


      <!-- =================================================
           RESET
           ================================================= -->

      <button
        class="button button-reset"
        onclick="resetScanner()"
      >

        ↻ RESET / SCAN NEXT

      </button>


      <!-- =================================================
           INSTRUCTIONS
           ================================================= -->

      <div class="instructions">

        QR Code peserta harus berisi
        <strong>nomor BIB saja</strong>.

        <br>

        Contoh:
        <strong>5001</strong>

        <br><br>

        Scanner akan membaca nomor BIB,
        lalu membuka data peserta secara otomatis.

      </div>


    </div>

  </div>

</div>


<script>


// =====================================================
// CONFIGURATION
// =====================================================

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzNmycrVEH4lpN97FYP_6BOaVKkMLgh560OcaVcv0zqqJH9rWMXqwzWN9GtI018zUR_/exec";


// =====================================================
// GLOBAL VARIABLES
// =====================================================

let html5QrCode = null;

let cameraRunning = false;

let scanLocked = false;

let lastBib = "";

let webAppWindow = null;

let messageInterval = null;


// =====================================================
// DOM ELEMENTS
// =====================================================

const statusElement =
  document.getElementById(
    "status"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const stopButton =
  document.getElementById(
    "stopButton"
  );


const qrResult =
  document.getElementById(
    "qrResult"
  );


const qrBib =
  document.getElementById(
    "qrBib"
  );


const webAppBox =
  document.getElementById(
    "webAppBox"
  );


const webAppStatus =
  document.getElementById(
    "webAppStatus"
  );


const manualBib =
  document.getElementById(
    "manualBib"
  );


// =====================================================
// STATUS
// =====================================================

function setStatus(
  message,
  type = "info"
) {

  statusElement.innerHTML =
    message;


  statusElement.className =
    "status status-" +
    type;

}


// =====================================================
// EXTRACT BIB
// =====================================================

function extractBib(
  value
) {

  let text =
    String(
      value || ""
    ).trim();


  if (!text) {

    return "";

  }


  // ---------------------------------------------------
  // PLAIN BIB
  // ---------------------------------------------------

  if (
    /^\d+$/.test(
      text
    )
  ) {

    return text;

  }


  // ---------------------------------------------------
  // URL ?bib=5001
  // ---------------------------------------------------

  try {

    const url =
      new URL(
        text
      );


    const bib =
      url.searchParams.get(
        "bib"
      );


    if (bib) {

      return bib.trim();

    }

  }

  catch (error) {

    // bukan URL

  }


  // ---------------------------------------------------
  // REGISTRATION ID / BIB
  // ---------------------------------------------------

  const parts =
    text.split(
      "/"
    );


  if (
    parts.length >= 2
  ) {

    const last =
      parts[
        parts.length - 1
      ].trim();


    if (
      /^\d+$/.test(
        last
      )
    ) {

      return last;

    }

  }


  // ---------------------------------------------------
  // FIND NUMBER
  // ---------------------------------------------------

  const match =
    text.match(
      /\b\d{3,6}\b/
    );


  if (match) {

    return match[0];

  }


  return "";

}


// =====================================================
// OPEN WEB APP WINDOW
// =====================================================

function openWebAppWindow() {


  // ---------------------------------------------------
  // Jika window sudah ada dan masih terbuka
  // ---------------------------------------------------

  if (
    webAppWindow &&
    !webAppWindow.closed
  ) {

    try {

      webAppWindow.focus();

    }

    catch (error) {

      console.log(
        "Focus error:",
        error
      );

    }

    return;

  }


  // ---------------------------------------------------
  // BUKA WINDOW SAAT USER MENEKAN START CAMERA
  // Ini penting supaya popup tidak diblokir browser.
  // ---------------------------------------------------

  try {

    webAppWindow =
      window.open(
        WEB_APP_URL,
        "PTBFRParticipantWindow"
      );

  }

  catch (error) {

    webAppWindow =
      null;

  }


  if (
    webAppWindow
  ) {

    webAppBox.style.display =
      "block";


    webAppStatus.textContent =
      "Halaman sistem PTBFR sedang dibuka...";

  }

  else {

    webAppBox.style.display =
      "block";


    webAppStatus.innerHTML =
      "⚠️ Browser memblokir jendela sistem PTBFR. " +
      "Izinkan popup untuk situs ini.";

  }

}


// =====================================================
// START CAMERA
// =====================================================

async function startCamera() {


  if (
    cameraRunning
  ) {

    return;

  }


  scanLocked =
    false;


  startButton.disabled =
    true;


  setStatus(
    "Membuka sistem PTBFR dan meminta akses kamera...",
    "info"
  );


  // ---------------------------------------------------
  // BUKA WEB APP TERLEBIH DAHULU
  // ---------------------------------------------------

  openWebAppWindow();


  // ---------------------------------------------------
  // START QR SCANNER
  // ---------------------------------------------------

  try {


    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const size =
          Math.floor(
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.70
          );


        return {

          width:
            size,

          height:
            size

        };

      },

      aspectRatio: 1.0,

      rememberLastUsedCamera: true

    };


    await html5QrCode.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    cameraRunning =
      true;


    startButton.style.display =
      "none";


    stopButton.style.display =
      "block";


    setStatus(
      "📷 Kamera aktif. Arahkan kamera ke QR peserta.",
      "success"
    );

  }


  catch (error) {


    console.error(
      "Camera error:",
      error
    );


    startButton.disabled =
      false;


    cameraRunning =
      false;


    setStatus(
      "Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.",
      "error"
    );

  }

}


// =====================================================
// SCAN FAILURE
// =====================================================

function onScanFailure(
  errorMessage
) {

  // Sengaja kosong.
  // Tidak perlu menampilkan error setiap frame.

}


// =====================================================
// SCAN SUCCESS
// =====================================================

function onScanSuccess(
  decodedText,
  decodedResult
) {


  if (
    scanLocked
  ) {

    return;

  }


  const bib =
    extractBib(
      decodedText
    );


  if (!bib) {


    setStatus(
      "QR terbaca, tetapi nomor BIB tidak ditemukan.",
      "error"
    );


    return;

  }


  scanLocked =
    true;


  lastBib =
    bib;


  // ---------------------------------------------------
  // DISPLAY BIB
  // ---------------------------------------------------

  qrBib.textContent =
    bib;


  qrResult.style.display =
    "block";


  webAppBox.style.display =
    "block";


  webAppStatus.innerHTML =
    "Mengirim BIB <strong>" +
    escapeHtml(
      bib
    ) +
    "</strong> ke sistem PTBFR...";


  setStatus(
    "✓ QR TERBACA<br>" +
    "BIB <strong>" +
    escapeHtml(
      bib
    ) +
    "</strong>",
    "success"
  );


  // ---------------------------------------------------
  // KIRIM KE APPS SCRIPT
  // ---------------------------------------------------

  sendBibToWebApp(
    bib
  );

}


// =====================================================
// SEND BIB TO WEB APP WINDOW
// =====================================================

function sendBibToWebApp(
  bib
) {


  // ---------------------------------------------------
  // PASTIKAN WINDOW TERBUKA
  // ---------------------------------------------------

  if (
    !webAppWindow ||
    webAppWindow.closed
  ) {


    openWebAppWindow();


    if (
      !webAppWindow ||
      webAppWindow.closed
    ) {

      setStatus(
        "⚠️ Sistem PTBFR tidak terbuka. Izinkan popup browser lalu coba lagi.",
        "error"
      );


      scanLocked =
        false;


      return;

    }

  }


  webAppStatus.innerHTML =
    "Mengirim BIB <strong>" +
    escapeHtml(
      bib
    ) +
    "</strong>...";


  // ---------------------------------------------------
  // KIRIM BERULANG
  //
  // Halaman Apps Script membutuhkan waktu untuk
  // selesai loading. Karena itu BIB dikirim beberapa
  // kali.
  // ---------------------------------------------------

  if (
    messageInterval
  ) {

    clearInterval(
      messageInterval
    );

  }


  let count =
    0;


  function sendMessage() {


    if (
      !webAppWindow ||
      webAppWindow.closed
    ) {

      clearInterval(
        messageInterval
      );


      messageInterval =
        null;


      setStatus(
        "Jendela sistem PTBFR ditutup.",
        "error"
      );


      return;

    }


    try {


      webAppWindow.postMessage(

        {

          type:
            "PTBFR_BIB_SCAN",

          bib:
            bib

        },

        "*"

      );


      count++;


      webAppStatus.innerHTML =
        "✓ BIB <strong>" +
        escapeHtml(
          bib
        ) +
        "</strong> dikirim ke sistem PTBFR.";


      setStatus(
        "✓ BIB " +
        escapeHtml(
          bib
        ) +
        " dikirim.<br>" +
        "Data peserta sedang dibuka...",
        "success"
      );


      // -------------------------------------------------
      // KIRIM 8 KALI
      // -------------------------------------------------

      if (
        count >= 8
      ) {

        clearInterval(
          messageInterval
        );


        messageInterval =
          null;

      }

    }


    catch (error) {


      console.error(
        "postMessage error:",
        error
      );

    }

  }


  // ---------------------------------------------------
  // KIRIM PERTAMA
  // ---------------------------------------------------

  sendMessage();


  // ---------------------------------------------------
  // ULANG SETIAP 700ms
  // ---------------------------------------------------

  messageInterval =
    setInterval(
      sendMessage,
      700
    );

}


// =====================================================
// MANUAL SEARCH
// =====================================================

function manualSearch() {


  const value =
    String(
      manualBib.value || ""
    ).trim();


  const bib =
    extractBib(
      value
    );


  if (!bib) {


    setStatus(
      "Masukkan nomor BIB terlebih dahulu.",
      "error"
    );


    return;

  }


  scanLocked =
    true;


  lastBib =
    bib;


  qrBib.textContent =
    bib;


  qrResult.style.display =
    "block";


  webAppBox.style.display =
    "block";


  // ---------------------------------------------------
  // BUKA APPS SCRIPT
  // ---------------------------------------------------

  openWebAppWindow();


  // ---------------------------------------------------
  // KIRIM BIB
  // ---------------------------------------------------

  sendBibToWebApp(
    bib
  );

}


// =====================================================
// RESET
// =====================================================

function resetScanner() {


  scanLocked =
    false;


  lastBib =
    "";


  if (
    messageInterval
  ) {

    clearInterval(
      messageInterval
    );


    messageInterval =
      null;

  }


  manualBib.value =
    "";


  qrBib.textContent =
    "-";


  qrResult.style.display =
    "none";


  webAppBox.style.display =
    "none";


  setStatus(
    "📷 Kamera aktif. Arahkan ke QR peserta berikutnya.",
    "success"
  );


  // ---------------------------------------------------
  // Jangan tutup window Apps Script.
  // Window akan dipakai lagi untuk peserta berikutnya.
  // ---------------------------------------------------

  if (
    webAppWindow &&
    !webAppWindow.closed
  ) {

    try {

      webAppWindow.focus();

    }

    catch (error) {

      console.log(
        error
      );

    }

  }

}


// =====================================================
// STOP CAMERA
// =====================================================

async function stopCamera() {


  if (
    !html5QrCode ||
    !cameraRunning
  ) {

    return;

  }


  try {

    await html5QrCode.stop();

  }

  catch (error) {

    console.error(
      "Stop camera error:",
      error
    );

  }


  try {

    html5QrCode.clear();

  }

  catch (error) {

    console.error(
      "Clear camera error:",
      error
    );

  }


  html5QrCode =
    null;


  cameraRunning =
    false;


  scanLocked =
    false;


  startButton.style.display =
    "block";


  startButton.disabled =
    false;


  stopButton.style.display =
    "none";


  setStatus(
    "Kamera berhenti. Tekan START CAMERA untuk mulai lagi.",
    "info"
  );

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
  text
) {


  return String(
    text == null
      ? ""
      : text
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


// =====================================================
// ENTER KEY - MANUAL SEARCH
// =====================================================

manualBib.addEventListener(
  "keydown",
  function(event) {


    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      manualSearch();

    }

  }
);


// =====================================================
// PAGE LOAD
// =====================================================

window.addEventListener(
  "load",
  function() {

    console.log(
      "PTBFR Camera Scanner loaded."
    );

  }
);


</script>


</body>

</html>
