<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    PTBFR 2026 - Race Pack Collection Scanner
  </title>


  <!-- =================================================
       QR SCANNER LIBRARY
       ================================================= -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 20px;
      background: #f3f5f6;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      color: #333;
    }


    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }


    /* =================================================
       MAIN CARD
       ================================================= */

    .card {
      background: #fff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow:
        0 5px 25px rgba(0,0,0,.08);
    }


    /* =================================================
       HEADER
       ================================================= */

    .header {
      background: #16849c;
      color: #fff;
      text-align: center;
      padding: 30px 20px;
    }


    .header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
    }


    .header p {
      margin: 8px 0 0;
      font-size: 19px;
    }


    /* =================================================
       CONTENT
       ================================================= */

    .content {
      padding: 25px;
    }


    /* =================================================
       START CAMERA BUTTON
       ================================================= */

    .button {
      width: 100%;
      min-height: 58px;
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }


    .button-start {
      background: #16849c;
      color: #fff;
    }


    .button-stop {
      background: #a33;
      color: #fff;
      margin-top: 12px;
      display: none;
    }


    .button-reset {
      background: #777;
      color: #fff;
      margin-top: 15px;
    }


    .button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }


    /* =================================================
       CAMERA
       ================================================= */

    #reader {
      width: 100%;
      margin-top: 20px;
      border-radius: 16px;
      overflow: hidden;
      background: #111;
      min-height: 50px;
    }


    /* =================================================
       STATUS
       ================================================= */

    .status {
      margin-top: 18px;
      padding: 17px;
      border-radius: 14px;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
    }


    .status-info {
      background: #eef6f8;
      color: #176c7e;
    }


    .status-success {
      background: #d9f5e7;
      color: #08783f;
    }


    .status-error {
      background: #ffe2e2;
      color: #a00000;
    }


    /* =================================================
       QR RESULT
       ================================================= */

    #qrResult {
      display: none;
      margin-top: 18px;
      background: #eef6f8;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }


    .qr-title {
      font-size: 15px;
      color: #666;
      margin-bottom: 6px;
    }


    .qr-bib {
      font-size: 45px;
      font-weight: 700;
      color: #16849c;
    }


    /* =================================================
       PARTICIPANT AREA
       ================================================= */

    .result-title {
      margin-top: 28px;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #555;
    }


    #webAppFrame {
      display: none;
      width: 100%;
      height: 760px;
      border: 2px solid #ddd;
      border-radius: 18px;
      background: #fff;
    }


    /* =================================================
       MANUAL BIB
       ================================================= */

    .manual {
      margin-top: 25px;
      padding-top: 22px;
      border-top: 1px solid #ddd;
    }


    .manual-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #555;
    }


    .manual-row {
      display: flex;
      gap: 10px;
    }


    .manual-input {
      flex: 1;
      min-width: 0;
      height: 54px;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 18px;
      text-align: center;
      outline: none;
    }


    .manual-input:focus {
      border-color: #16849c;
    }


    .manual-button {
      width: 130px;
      height: 54px;
      border: none;
      border-radius: 12px;
      background: #16849c;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }


    /* =================================================
       INSTRUCTIONS
       ================================================= */

    .instructions {
      margin-top: 20px;
      text-align: center;
      color: #666;
      font-size: 15px;
      line-height: 1.6;
    }


    .instructions strong {
      color: #333;
    }


    /* =================================================
       MOBILE
       ================================================= */

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }


      .content {
        padding: 17px;
      }


      .header {
        padding: 25px 15px;
      }


      .header h1 {
        font-size: 27px;
      }


      .header p {
        font-size: 17px;
      }


      .manual-row {
        display: block;
      }


      .manual-input {
        width: 100%;
      }


      .manual-button {
        width: 100%;
        margin-top: 10px;
      }


      #webAppFrame {
        height: 700px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="card">


    <!-- =================================================
         HEADER
         ================================================= -->

    <div class="header">

      <h1>
        PTBFR 2026
      </h1>

      <p>
        Race Pack Collection Scanner
      </p>

    </div>


    <div class="content">


      <!-- =================================================
           START CAMERA
           ================================================= -->

      <button
        id="startButton"
        class="button button-start"
        onclick="startCamera()"
      >

        📷 START CAMERA &amp; SCAN QR

      </button>


      <button
        id="stopButton"
        class="button button-stop"
        onclick="stopCamera()"
      >

        ✕ STOP CAMERA

      </button>


      <!-- =================================================
           CAMERA AREA
           ================================================= -->

      <div id="reader"></div>


      <!-- =================================================
           STATUS
           ================================================= -->

      <div
        id="status"
        class="status status-info"
      >

        Tekan <strong>START CAMERA</strong>
        untuk mulai scan QR peserta.

      </div>


      <!-- =================================================
           QR RESULT
           ================================================= -->

      <div id="qrResult">

        <div class="qr-title">
          QR TERBACA
        </div>

        <div
          id="qrBib"
          class="qr-bib"
        >
          -
        </div>

      </div>


      <!-- =================================================
           WEB APP RESULT
           ================================================= -->

      <div
        id="resultTitle"
        class="result-title"
        style="display:none;"
      >

        DATA PESERTA

      </div>


      <iframe
        id="webAppFrame"
        title="PTBFR Participant Data"
        allow="camera"
      >
      </iframe>


      <!-- =================================================
           MANUAL INPUT
           ================================================= -->

      <div class="manual">

        <div class="manual-title">

          Manual Search BIB

        </div>


        <div class="manual-row">

          <input
            id="manualBib"
            class="manual-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Contoh: 5001"
          >


          <button
            class="manual-button"
            onclick="manualSearch()"
          >

            SEARCH

          </button>

        </div>

      </div>


      <!-- =================================================
           RESET
           ================================================= -->

      <button
        class="button button-reset"
        onclick="resetScanner()"
      >

        ↻ RESET / SCAN NEXT

      </button>


      <!-- =================================================
           INSTRUCTIONS
           ================================================= -->

      <div class="instructions">

        QR Code peserta harus berisi
        <strong>nomor BIB saja</strong>.

        <br>

        Contoh:
        <strong>5001</strong>

        <br><br>

        Scanner akan membaca nomor BIB,
        lalu membuka data peserta secara otomatis.

      </div>


    </div>

  </div>

</div>


<script>


// =====================================================
// CONFIGURATION
// =====================================================

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzNmycrVEH4lpN97FYP_6BOaVKkMLgh560OcaVcv0zqqJH9rWMXqwzWN9GtI018zUR_/exec";


// =====================================================
// GLOBAL VARIABLES
// =====================================================

let html5QrCode = null;

let cameraRunning = false;

let scanLocked = false;

let lastBib = "";

let messageTimer = null;


// =====================================================
// DOM ELEMENTS
// =====================================================

const statusElement =
  document.getElementById(
    "status"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const stopButton =
  document.getElementById(
    "stopButton"
  );


const qrResult =
  document.getElementById(
    "qrResult"
  );


const qrBib =
  document.getElementById(
    "qrBib"
  );


const webAppFrame =
  document.getElementById(
    "webAppFrame"
  );


const resultTitle =
  document.getElementById(
    "resultTitle"
  );


const manualBib =
  document.getElementById(
    "manualBib"
  );


// =====================================================
// SET STATUS
// =====================================================

function setStatus(
  message,
  type = "info"
) {

  statusElement.innerHTML =
    message;


  statusElement.className =
    "status status-" +
    type;

}


// =====================================================
// EXTRACT BIB
// =====================================================

function extractBib(
  value
) {

  let text =
    String(
      value || ""
    ).trim();


  if (!text) {
    return "";
  }


  // ---------------------------------------------------
  // PLAIN BIB
  // ---------------------------------------------------

  if (
    /^\d+$/.test(
      text
    )
  ) {

    return text;

  }


  // ---------------------------------------------------
  // URL
  // ---------------------------------------------------

  try {

    const url =
      new URL(
        text
      );


    const bib =
      url.searchParams.get(
        "bib"
      );


    if (bib) {

      return bib.trim();

    }

  }

  catch (error) {

    // Not a URL

  }


  // ---------------------------------------------------
  // REGISTRATION ID / BIB
  // ---------------------------------------------------

  const parts =
    text.split(
      "/"
    );


  if (
    parts.length >= 2
  ) {

    const last =
      parts[
        parts.length - 1
      ].trim();


    if (
      /^\d+$/.test(
        last
      )
    ) {

      return last;

    }

  }


  // ---------------------------------------------------
  // FIND NUMBER
  // ---------------------------------------------------

  const match =
    text.match(
      /\b\d{3,6}\b/
    );


  if (match) {

    return match[0];

  }


  return "";

}


// =====================================================
// START CAMERA
// =====================================================

async function startCamera() {


  if (cameraRunning) {
    return;
  }


  scanLocked =
    false;


  setStatus(
    "Meminta akses kamera...",
    "info"
  );


  startButton.disabled =
    true;


  try {


    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const size =
          Math.floor(
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.70
          );

        return {
          width: size,
          height: size
        };

      },

      aspectRatio: 1.0,

      rememberLastUsedCamera: true

    };


    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    cameraRunning =
      true;


    startButton.style.display =
      "none";


    stopButton.style.display =
      "block";


    setStatus(
      "📷 Kamera aktif. Arahkan kamera ke QR peserta.",
      "success"
    );

  }


  catch (error) {


    console.error(
      "Camera error:",
      error
    );


    startButton.disabled =
      false;


    cameraRunning =
      false;


    setStatus(
      "Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.",
      "error"
    );

  }

}


// =====================================================
// SCAN FAILURE
// =====================================================

function onScanFailure(
  errorMessage
) {

  // Sengaja dikosongkan.
  // Error scan per frame tidak perlu
  // ditampilkan kepada user.

}


// =====================================================
// SCAN SUCCESS
// =====================================================

function onScanSuccess(
  decodedText,
  decodedResult
) {


  if (scanLocked) {
    return;
  }


  const bib =
    extractBib(
      decodedText
    );


  if (!bib) {

    setStatus(
      "QR terbaca, tetapi nomor BIB tidak ditemukan.",
      "error"
    );

    return;

  }


  scanLocked =
    true;


  lastBib =
    bib;


  // ---------------------------------------------------
  // DISPLAY QR RESULT
  // ---------------------------------------------------

  qrBib.textContent =
    bib;


  qrResult.style.display =
    "block";


  // ---------------------------------------------------
  // DISPLAY RESULT FRAME
  // ---------------------------------------------------

  resultTitle.style.display =
    "block";


  webAppFrame.style.display =
    "block";


  // ---------------------------------------------------
  // STATUS
  // ---------------------------------------------------

  setStatus(
    "✓ QR TERBACA<br>" +
    "Mencari peserta dengan BIB <strong>" +
    escapeHtml(bib) +
    "</strong>...",
    "success"
  );


  // ---------------------------------------------------
  // OPEN WEB APP
  // ---------------------------------------------------

  loadParticipantPage(
    bib
  );

}


// =====================================================
// LOAD PARTICIPANT PAGE
// =====================================================

function loadParticipantPage(
  bib
) {


  // ---------------------------------------------------
  // Jika iframe belum memiliki source,
  // buka Web App terlebih dahulu.
  // ---------------------------------------------------

  const currentSource =
    webAppFrame.getAttribute(
      "src"
    );


  if (
    !currentSource
  ) {

    webAppFrame.src =
      WEB_APP_URL;


    webAppFrame.onload =
      function() {

        sendBibToWebApp(
          bib
        );

      };


    return;

  }


  // ---------------------------------------------------
  // Jika sudah terbuka,
  // langsung kirim BIB.
  // ---------------------------------------------------

  sendBibToWebApp(
    bib
  );

}


// =====================================================
// SEND BIB TO WEB APP
// =====================================================

function sendBibToWebApp(
  bib
) {


  setStatus(
    "Mengirim BIB <strong>" +
    escapeHtml(bib) +
    "</strong> ke sistem PTBFR...",
    "info"
  );


  try {

    webAppFrame.contentWindow.postMessage(

      {
        type:
          "PTBFR_BIB_SCAN",

        bib:
          bib

      },

      "*"

    );


    // -------------------------------------------------
    // Kirim beberapa kali untuk memastikan pesan
    // diterima setelah halaman selesai loading.
    // -------------------------------------------------

    let count =
      0;


    const interval =
      setInterval(
        function() {


          count++;


          try {

            webAppFrame.contentWindow.postMessage(

              {
                type:
                  "PTBFR_BIB_SCAN",

                bib:
                  bib

              },

              "*"

            );

          }

          catch (error) {

            console.error(
              error
            );

          }


          if (
            count >= 5
          ) {

            clearInterval(
              interval
            );

          }

        },

        700
      );


    setStatus(
      "✓ BIB <strong>" +
      escapeHtml(bib) +
      "</strong> dikirim. Menunggu data peserta...",
      "success"
    );

  }


  catch (error) {

    console.error(
      "postMessage error:",
      error
    );


    setStatus(
      "Gagal mengirim BIB ke sistem.",
      "error"
    );

  }

}


// =====================================================
// MANUAL SEARCH
// =====================================================

function manualSearch() {


  const value =
    String(
      manualBib.value || ""
    ).trim();


  const bib =
    extractBib(
      value
    );


  if (!bib) {

    setStatus(
      "Masukkan nomor BIB terlebih dahulu.",
      "error"
    );

    return;

  }


  scanLocked =
    true;


  lastBib =
    bib;


  qrBib.textContent =
    bib;


  qrResult.style.display =
    "block";


  resultTitle.style.display =
    "block";


  webAppFrame.style.display =
    "block";


  loadParticipantPage(
    bib
  );

}


// =====================================================
// RESET SCANNER
// =====================================================

function resetScanner() {


  scanLocked =
    false;


  lastBib =
    "";


  manualBib.value =
    "";


  qrBib.textContent =
    "-";


  qrResult.style.display =
    "none";


  resultTitle.style.display =
    "none";


  // ---------------------------------------------------
  // Jangan reload iframe.
  // Kita cukup kirim reset dengan cara
  // membuka ulang halaman Apps Script.
  // ---------------------------------------------------

  webAppFrame.style.display =
    "none";


  webAppFrame.onload =
    null;


  webAppFrame.removeAttribute(
    "src"
  );


  setStatus(
    "Tekan <strong>START CAMERA</strong> untuk scan QR peserta berikutnya.",
    "info"
  );


  if (
    cameraRunning
  ) {

    setStatus(
      "📷 Kamera aktif. Arahkan ke QR peserta berikutnya.",
      "success"
    );

  }

}


// =====================================================
// STOP CAMERA
// =====================================================

async function stopCamera() {


  if (
    !html5QrCode ||
    !cameraRunning
  ) {

    return;

  }


  try {

    await html5QrCode.stop();

  }

  catch (error) {

    console.error(
      "Stop camera error:",
      error
    );

  }


  try {

    html5QrCode.clear();

  }

  catch (error) {

    console.error(
      "Clear camera error:",
      error
    );

  }


  html5QrCode =
    null;


  cameraRunning =
    false;


  scanLocked =
    false;


  startButton.style.display =
    "block";


  startButton.disabled =
    false;


  stopButton.style.display =
    "none";


  setStatus(
    "Kamera berhenti. Tekan START CAMERA untuk mulai lagi.",
    "info"
  );

}


// =====================================================
// IFRAME LOAD EVENT
// =====================================================

webAppFrame.addEventListener(
  "load",
  function() {


    if (
      lastBib
    ) {

      sendBibToWebApp(
        lastBib
      );

    }

  }
);


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
  text
) {


  return String(
    text == null
      ? ""
      : text
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


// =====================================================
// ENTER KEY - MANUAL SEARCH
// =====================================================

manualBib.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      manualSearch();

    }

  }
);


// =====================================================
// PAGE LOAD
// =====================================================

window.addEventListener(
  "load",
  function() {

    console.log(
      "PTBFR Camera Scanner loaded."
    );

  }
);


</script>


</body>

</html>
