<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    PTBFR 2026 - Race Pack Collection Scanner
  </title>


  <!-- QR SCANNER LIBRARY -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f7fa;
      color: #111827;

    }


    body {

      padding: 20px;

    }


    .container {

      width: 100%;
      max-width: 700px;

      margin: 0 auto;

    }


    /* ============================================================
       HEADER
       ============================================================ */

    .header {

      background: #111827;

      color: white;

      border-radius: 18px;

      padding: 24px 20px;

      text-align: center;

      margin-bottom: 18px;

      box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.08);

    }


    .header h1 {

      margin: 0;

      font-size: 28px;

      line-height: 1.2;

    }


    .header p {

      margin: 8px 0 0;

      font-size: 14px;

      opacity: 0.85;

    }


    /* ============================================================
       CARD
       ============================================================ */

    .card {

      background: white;

      border-radius: 18px;

      padding: 20px;

      margin-bottom: 18px;

      box-shadow:
        0 6px 20px
        rgba(0, 0, 0, 0.07);

    }


    .card-title {

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 14px;

    }


    /* ============================================================
       CAMERA
       ============================================================ */

    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 14px;

      background: #111827;

      min-height: 260px;

    }


    #reader video {

      width: 100% !important;

      border-radius: 14px;

    }


    #reader__dashboard {

      color: white !important;

    }


    #reader__dashboard_section {

      padding: 10px !important;

    }


    #reader__dashboard_section_csr {

      color: white !important;

    }


    .camera-placeholder {

      min-height: 260px;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      color: #9ca3af;

      padding: 30px;

      font-size: 15px;

      line-height: 1.6;

    }


    /* ============================================================
       BUTTONS
       ============================================================ */

    .button-row {

      display: flex;

      gap: 10px;

      flex-wrap: wrap;

      margin-top: 14px;

    }


    button {

      border: 0;

      border-radius: 12px;

      padding: 13px 18px;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;

    }


    button:active {

      transform: scale(0.98);

    }


    .btn-primary {

      background: #111827;

      color: white;

    }


    .btn-primary:hover {

      background: #1f2937;

    }


    .btn-danger {

      background: #dc2626;

      color: white;

    }


    .btn-secondary {

      background: #e5e7eb;

      color: #111827;

    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

    }


    /* ============================================================
       STATUS
       ============================================================ */

    .status {

      margin-top: 12px;

      padding: 12px 14px;

      border-radius: 10px;

      font-size: 14px;

      display: none;

      line-height: 1.5;

    }


    .status.show {

      display: block;

    }


    .status.info {

      background: #eff6ff;

      color: #1d4ed8;

    }


    .status.success {

      background: #f0fdf4;

      color: #15803d;

    }


    .status.error {

      background: #fef2f2;

      color: #b91c1c;

    }


    .status.warning {

      background: #fffbeb;

      color: #92400e;

    }


    /* ============================================================
       SEARCH
       ============================================================ */

    .search-row {

      display: flex;

      gap: 10px;

    }


    .search-row input {

      flex: 1;

      min-width: 0;

      border:
        1px solid #d1d5db;

      border-radius: 12px;

      padding: 13px 14px;

      font-size: 15px;

      outline: none;

    }


    .search-row input:focus {

      border-color: #111827;

      box-shadow:
        0 0 0 3px
        rgba(17, 24, 39, 0.08);

    }


    /* ============================================================
       SCAN VALUE
       ============================================================ */

    .scan-value {

      margin-top: 10px;

      padding: 10px 12px;

      background: #f3f4f6;

      border-radius: 10px;

      font-family: monospace;

      font-size: 13px;

      word-break: break-word;

      display: none;

    }


    .scan-value.show {

      display: block;

    }


    /* ============================================================
       NOTES
       ============================================================ */

    .small-note {

      margin-top: 10px;

      font-size: 12px;

      color: #6b7280;

      line-height: 1.5;

    }


    /* ============================================================
       FOOTER
       ============================================================ */

    .footer {

      text-align: center;

      color: #6b7280;

      font-size: 12px;

      padding: 10px 0 25px;

    }


    /* ============================================================
       MOBILE
       ============================================================ */

    @media (max-width: 600px) {

      body {

        padding: 12px;

      }


      .header {

        padding: 20px 15px;

      }


      .header h1 {

        font-size: 23px;

      }


      .card {

        padding: 15px;

      }


      .search-row {

        flex-direction: column;

      }


      .search-row button {

        width: 100%;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- ==========================================================
         HEADER
         ========================================================== -->

    <div class="header">

      <h1>
        PTBFR 2026
      </h1>

      <p>
        Race Pack Collection Scanner
      </p>

    </div>


    <!-- ==========================================================
         CAMERA
         ========================================================== -->

    <div class="card">

      <div class="card-title">
        📷 Scan QR Code
      </div>


      <div id="reader">

        <div
          id="cameraPlaceholder"
          class="camera-placeholder"
        >

          Kamera belum aktif.<br>

          Tekan tombol
          <b>START CAMERA</b>.

        </div>

      </div>


      <div class="button-row">

        <button
          id="startCameraButton"
          class="btn-primary"
          onclick="startCamera()"
        >

          📷 START CAMERA

        </button>


        <button
          id="stopCameraButton"
          class="btn-danger"
          onclick="stopCamera()"
          disabled
        >

          ⏹ STOP CAMERA

        </button>

      </div>


      <div
        id="cameraStatus"
        class="status"
      ></div>


      <div
        id="scanValue"
        class="scan-value"
      ></div>


      <div class="small-note">

        QR Code dapat berisi
        <b>BIB</b>,
        <b>Nama Lengkap</b>,
        atau
        <b>Registration ID</b>.

      </div>

    </div>


    <!-- ==========================================================
         MANUAL SEARCH
         ========================================================== -->

    <div class="card">

      <div class="card-title">
        🔎 Manual Search
      </div>


      <div class="search-row">

        <input
          id="searchInput"
          type="text"
          placeholder="Nama / BIB / Registration ID"
          autocomplete="off"
          onkeydown="handleSearchKey(event)"
        >


        <button
          class="btn-primary"
          onclick="manualSearch()"
        >

          SEARCH

        </button>

      </div>


      <div
        id="searchStatus"
        class="status"
      ></div>

    </div>


    <!-- ==========================================================
         FOOTER
         ========================================================== -->

    <div class="footer">

      Pangkung Tibah Beach Fun Run 2026

      <br>

      BeLong Project

    </div>


  </div>


  <script>


    /*
     * ============================================================
     * CONFIGURATION
     * ============================================================
     *
     * Apps Script Web App.
     *
     * IMPORTANT:
     *
     * We DO NOT use window.open().
     *
     * We DO NOT use postMessage().
     *
     * We DO NOT use URL hash (#5001).
     *
     * We DO NOT use ?q=5001.
     *
     * We use:
     *
     * /exec?bib=5001
     *
     * ============================================================
     */


    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbzNmycrVEH4IpN97FYP_6BOaVKkMLgh560OcaVcv0zqqJH9rWMXqwzWN9GtI018zUR_/exec";


    /*
     * ============================================================
     * GLOBAL VARIABLES
     * ============================================================
     */

    let html5QrCode = null;

    let cameraRunning = false;

    let lastScannedText = "";

    let lastScanTime = 0;

    let scanRedirecting = false;


    /*
     * ============================================================
     * PAGE LOAD
     * ============================================================
     */

    window.addEventListener(
      "load",
      function() {

        showCameraPlaceholder();

      }
    );


    /*
     * ============================================================
     * START CAMERA
     * ============================================================
     */

    async function startCamera() {

      if (cameraRunning) {

        return;

      }


      /*
       * No window.open().
       *
       * Scanner tetap berada
       * di halaman GitHub.
       */

      setCameraStatus(
        "Mengaktifkan kamera...",
        "info"
      );


      try {

        html5QrCode =
          new Html5Qrcode(
            "reader"
          );


        const config = {

          fps: 10,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const minEdge =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              );


            const size =
              Math.floor(
                minEdge * 0.70
              );


            return {

              width: size,

              height: size

            };

          },


          aspectRatio: 1.0,

          rememberLastUsedCamera: true

        };


        await html5QrCode.start(

          {
            facingMode: "environment"
          },

          config,

          onScanSuccess,

          onScanFailure

        );


        cameraRunning = true;


        document.getElementById(
          "startCameraButton"
        ).disabled = true;


        document.getElementById(
          "stopCameraButton"
        ).disabled = false;


        setCameraStatus(
          "Kamera aktif. Arahkan kamera ke QR Code peserta.",
          "success"
        );


      } catch (error) {

        console.error(
          "Camera start error:",
          error
        );


        cameraRunning = false;


        setCameraStatus(
          "Kamera gagal dibuka. Pastikan izin kamera diberikan.",
          "error"
        );

      }

    }


    /*
     * ============================================================
     * STOP CAMERA
     * ============================================================
     */

    async function stopCamera() {

      if (
        html5QrCode &&
        cameraRunning
      ) {

        try {

          await html5QrCode.stop();

        } catch (error) {

          console.error(
            "Camera stop error:",
            error
          );

        }


        try {

          await html5QrCode.clear();

        } catch (error) {

          console.error(
            "Camera clear error:",
            error
          );

        }

      }


      html5QrCode = null;

      cameraRunning = false;


      document.getElementById(
        "startCameraButton"
      ).disabled = false;


      document.getElementById(
        "stopCameraButton"
      ).disabled = true;


      showCameraPlaceholder();


      setCameraStatus(
        "Kamera berhenti.",
        "info"
      );

    }


    /*
     * ============================================================
     * QR SCAN SUCCESS
     * ============================================================
     */

    function onScanSuccess(
      decodedText,
      decodedResult
    ) {

      if (scanRedirecting) {

        return;

      }


      const now =
        Date.now();


      /*
       * Prevent duplicate scan.
       */

      if (
        decodedText === lastScannedText &&
        now - lastScanTime < 3000
      ) {

        return;

      }


      lastScannedText =
        decodedText;


      lastScanTime =
        now;


      /*
       * Use COMPLETE QR CONTENT.
       *
       * Contoh:
       *
       * 5001
       *
       * I Gusti Made Dharma Putra Sesana
       *
       * PTBFR2026-0001
       */

      const scanValue =
        String(
          decodedText || ""
        ).trim();


      if (!scanValue) {

        return;

      }


      console.log(
        "QR CONTENT:",
        scanValue
      );


      /*
       * Display QR content.
       */

      showScanValue(
        scanValue
      );


      /*
       * Prevent multiple redirects.
       */

      scanRedirecting = true;


      setCameraStatus(
        "QR berhasil dibaca. Membuka data peserta...",
        "success"
      );


      /*
       * Stop camera before redirect.
       */

      stopCamera()
        .catch(
          function(error) {

            console.error(
              error
            );

          }
        )
        .finally(
          function() {


            /*
             * ====================================================
             * IMPORTANT
             * ====================================================
             *
             * Gunakan parameter:
             *
             * ?bib=
             *
             * BUKAN:
             *
             * ?q=
             *
             * BUKAN:
             *
             * #5001
             *
             * ====================================================
             */

            const targetUrl =
              WEB_APP_URL +
              "?bib=" +
              encodeURIComponent(
                scanValue
              );


            console.log(
              "Redirecting to:",
              targetUrl
            );


            /*
             * SAME TAB
             *
             * Tidak membuka tab baru.
             */

            window.location.href =
              targetUrl;

          }
        );

    }


    /*
     * ============================================================
     * QR SCAN FAILURE
     * ============================================================
     */

    function onScanFailure(
      errorMessage
    ) {

      /*
       * Normal condition ketika kamera
       * sedang mencari QR.
       *
       * Jangan tampilkan error.
       */

    }


    /*
     * ============================================================
     * MANUAL SEARCH
     * ============================================================
     */

    function handleSearchKey(
      event
    ) {

      if (
        event.key === "Enter"
      ) {

        manualSearch();

      }

    }


    function manualSearch() {

      const input =
        document.getElementById(
          "searchInput"
        );


      const value =
        input.value.trim();


      if (!value) {

        setSearchStatus(
          "Masukkan Nama, BIB, atau Registration ID.",
          "warning"
        );

        return;

      }


      /*
       * ========================================================
       * MANUAL SEARCH JUGA MENGGUNAKAN ?bib=
       * ========================================================
       */

      const targetUrl =
        WEB_APP_URL +
        "?bib=" +
        encodeURIComponent(
          value
        );


      setSearchStatus(
        "Membuka data peserta...",
        "success"
      );


      /*
       * SAME TAB.
       */

      window.location.href =
        targetUrl;

    }


    /*
     * ============================================================
     * SHOW SCAN VALUE
     * ============================================================
     */

    function showScanValue(
      value
    ) {

      const element =
        document.getElementById(
          "scanValue"
        );


      element.textContent =
        "QR Content: " +
        value;


      element.classList.add(
        "show"
      );

    }


    /*
     * ============================================================
     * CAMERA STATUS
     * ============================================================
     */

    function setCameraStatus(
      message,
      type
    ) {

      const element =
        document.getElementById(
          "cameraStatus"
        );


      if (!message) {

        element.textContent =
          "";

        element.className =
          "status";

        return;

      }


      element.textContent =
        message;


      element.className =
        "status show " +
        type;

    }


    /*
     * ============================================================
     * SEARCH STATUS
     * ============================================================
     */

    function setSearchStatus(
      message,
      type
    ) {

      const element =
        document.getElementById(
          "searchStatus"
        );


      if (!message) {

        element.textContent =
          "";

        element.className =
          "status";

        return;

      }


      element.textContent =
        message;


      element.className =
        "status show " +
        type;

    }


    /*
     * ============================================================
     * CAMERA PLACEHOLDER
     * ============================================================
     */

    function showCameraPlaceholder() {

      const reader =
        document.getElementById(
          "reader"
        );


      reader.innerHTML = `

        <div
          id="cameraPlaceholder"
          class="camera-placeholder"
        >

          Kamera belum aktif.<br>

          Tekan tombol
          <b>START CAMERA</b>.

        </div>

      `;

    }


  </script>


</body>

</html>
