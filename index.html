<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTBFR 2026 – Camera Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f7;color:#333}
.wrap{width:min(520px,94vw);margin:28px auto}.header{background:#238da1;color:#fff;border-radius:18px 18px 0 0;padding:26px 20px;text-align:center}
.header h1{margin:0 0 6px;font-size:28px}.header p{margin:0;font-size:17px}
.card{background:#fff;padding:22px;border-radius:0 0 18px 18px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
label{display:block;font-weight:700;margin:4px 0 8px}input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:15px;margin-bottom:12px}
button{width:100%;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;background:#238da1;color:#fff;margin-top:8px}
button.secondary{background:#666}button:disabled{opacity:.55;cursor:not-allowed}
#reader{width:100%;margin-top:16px;border-radius:12px;overflow:hidden;background:#111;min-height:80px}
#status{margin-top:14px;padding:12px;border-radius:10px;background:#eef6f8;line-height:1.45;font-size:14px}
.success{background:#eaf7ed!important;color:#1f6b32}.error{background:#fff0f0!important;color:#9b2226}.warning{background:#fff8e6!important;color:#7a5600}
.small{color:#666;font-size:13px;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><h1>PTBFR 2026</h1><p>Race Pack Camera Scanner</p></div>
<div class="card">
<label for="webAppUrl">Race Pack Web App URL</label>
<input id="webAppUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
<button id="startBtn">📷 START CAMERA &amp; SCAN QR</button>
<button id="stopBtn" class="secondary" style="display:none">⏹ STOP CAMERA</button>
<div id="reader"></div>
<div id="status">Masukkan URL Web App, lalu tekan START CAMERA.</div>
<div class="small">
Setelah QR terbaca, halaman otomatis membuka Race Pack Web App dan menampilkan data peserta.
<br><br><b>Penting:</b> halaman scanner harus dibuka melalui HTTPS atau localhost agar kamera dapat digunakan.
</div>
</div></div>

<script>
const urlInput=document.getElementById("webAppUrl");
const startBtn=document.getElementById("startBtn");
const stopBtn=document.getElementById("stopBtn");
const statusBox=document.getElementById("status");
let scanner=null,scanning=false,redirecting=false;

const saved=localStorage.getItem("ptbfr_webapp_url");
if(saved) urlInput.value=saved;

function setStatus(message,type=""){
  statusBox.className="";
  if(type) statusBox.classList.add(type);
  statusBox.innerHTML=message;
}
function normalizeUrl(v){
  let u=(v||"").trim();
  if(!u)return "";
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  return u;
}
function targetUrl(decoded){
  const web=normalizeUrl(urlInput.value);
  if(!web)throw new Error("URL Race Pack Web App belum diisi.");
  try{
    const u=new URL(decoded.trim());
    if((u.protocol==="http:"||u.protocol==="https:")&&u.searchParams.has("code"))return u.toString();
  }catch(e){}
  return web+(web.includes("?")?"&":"?")+"code="+encodeURIComponent(decoded.trim());
}
async function startScanner(){
  if(scanning)return;
  const web=normalizeUrl(urlInput.value);
  if(!web){setStatus("⚠️ Isi URL Race Pack Web App terlebih dahulu.","warning");urlInput.focus();return;}
  if(!window.isSecureContext){
    setStatus("❌ Kamera membutuhkan HTTPS atau localhost.<br><br>Jangan buka scanner dari file://. Upload halaman ini ke hosting HTTPS seperti GitHub Pages/Netlify, atau jalankan lewat localhost.","error");
    return;
  }
  localStorage.setItem("ptbfr_webapp_url",web);
  startBtn.disabled=true;stopBtn.style.display="block";redirecting=false;
  setStatus("📷 Meminta akses kamera...");
  try{
    scanner=new Html5Qrcode("reader");
    const cameras=await Html5Qrcode.getCameras();
    if(!cameras||!cameras.length)throw new Error("Tidak ada kamera yang terdeteksi.");
    let cam=cameras[0].id;
    const preferred=cameras.find(c=>/back|rear|environment/i.test(c.label||""));
    if(preferred)cam=preferred.id;
    await scanner.start(cam,{fps:10,qrbox:{width:280,height:280},aspectRatio:1},
      onScanSuccess,()=>{});
    scanning=true;
    setStatus("🟢 Kamera aktif. Arahkan QR Code peserta ke kotak scanner.","success");
  }catch(err){
    console.error(err);
    startBtn.disabled=false;stopBtn.style.display="none";
    let msg=err&&err.message?err.message:String(err);
    setStatus("❌ Kamera gagal dibuka.<br><br>"+escapeHtml(msg),"error");
    if(scanner){try{await scanner.clear()}catch(e){}scanner=null;}
  }
}
async function stopScanner(){
  if(!scanner)return;
  try{if(scanning)await scanner.stop()}catch(e){}
  try{await scanner.clear()}catch(e){}
  scanner=null;scanning=false;redirecting=false;
  startBtn.disabled=false;stopBtn.style.display="none";
  setStatus("Kamera dihentikan. Tekan START CAMERA untuk scan berikutnya.");
}
async function onScanSuccess(decodedText){
  if(redirecting)return;
  redirecting=true;
  setStatus("✅ QR TERBACA! Membuka data peserta...","success");
  try{if(scanner&&scanning){await scanner.stop();scanning=false;}}catch(e){}
  const target=targetUrl(decodedText);
  setTimeout(()=>{window.location.href=target},350);
}
function escapeHtml(text){
  return text.replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));
}
startBtn.addEventListener("click",startScanner);
stopBtn.addEventListener("click",stopScanner);
window.addEventListener("beforeunload",()=>{if(scanner&&scanning){try{scanner.stop()}catch(e){}}});
</script>
</body>
</html>
